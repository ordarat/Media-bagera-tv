name: LiveZon Cloud Playout

on:
  workflow_dispatch:
    inputs:
      stream_url:
        description: 'لینکی ڤیدیۆ یان m3u8 لێرە دابنێ'
        required: true
        type: string
        default: 'https://live.rudaw.net/hls/rudaw-tv/master.m3u8'
      ticker_text:
        description: 'نووسینی شریتی هەواڵەکان'
        required: true
        type: string
        default: 'بەخێربێن بۆ کەناڵی ناوخۆیی میدیا باگێرا'

jobs:
  start_stream:
    runs-on: ubuntu-latest
    steps:
      - name: دابەزاندنی بەرنامەکان و فۆنت
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install arabic-reshaper python-bidi --break-system-packages
          wget -qO myfont.ttf "https://raw.githubusercontent.com/googlefonts/noto-fonts/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"

      - name: ڕێکخستنی پیتە کوردییەکان
        run: |
          cat << 'EOF' > format_text.py
          import sys
          import arabic_reshaper
          from bidi.algorithm import get_display
          
          text = sys.argv[1]
          reshaped_text = arabic_reshaper.reshape(text)
          bidi_text = get_display(reshaped_text)
          
          with open("ticker.txt", "w", encoding="utf-8") as f:
              f.write(bidi_text)
          EOF
          python3 format_text.py "${{ github.event.inputs.ticker_text }}"

      - name: دەستپێکردنی پەخش بە دیزاینی نوێوە
        env:
          RTMP_URL: ${{ secrets.OKRU_RTMP_URL }}
        run: |
          ffmpeg -re -i "${{ github.event.inputs.stream_url }}" \
          -vf "drawbox=y=ih-70:color=black@0.75:width=iw:height=70:t=fill,drawtext=fontfile=myfont.ttf:textfile=ticker.txt:fontcolor=white:fontsize=36:x=w-mod(t*130\,w+tw):y=h-55" \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -f flv "$RTMP_URL"
