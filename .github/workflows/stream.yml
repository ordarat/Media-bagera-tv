name: LiveZon Cloud Playout
on:
  workflow_dispatch:
concurrency:
  group: "livezon-playout"
  cancel-in-progress: true

jobs:
  start_stream:
    runs-on: ubuntu-latest
    steps:
      - name: ئامادەکردنی سێرڤەر و پێداویستییەکان
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install Pillow arabic-reshaper python-bidi requests --break-system-packages
          wget -qO myfont.ttf "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf"

      - name: گوێگری خێرای فایەربەیس و خشتەی کاتژمێری
        env:
          RTMP_URL: ${{ secrets.OKRU_RTMP_URL }}
        run: |
          cat << 'EOF' > stream_manager.py
          import os, json, subprocess, time, requests, datetime
          import arabic_reshaper
          from bidi.algorithm import get_display

          RTDB_URL = "https://media-bagera-63d90-default-rtdb.europe-west1.firebasedatabase.app/system/mcr_data.json"
          RTMP_URL = os.environ.get('RTMP_URL', '')

          # فەنکشنی تایبەت بۆ چارەسەری پیتە کوردییەکان و ئاراستەی نوسین
          def write_bidi_text(text, filename):
              try:
                  reshaper = arabic_reshaper.ArabicReshaper(configuration={'language': 'Kurdish', 'delete_harakat': True})
                  bidi_text = get_display(reshaper.reshape(text))
                  with open(filename, "w", encoding="utf-8") as f:
                      f.write(bidi_text)
              except Exception:
                  with open(filename, "w", encoding="utf-8") as f:
                      f.write(text)

          write_bidi_text("بەخێربێن بۆ کەناڵی میدیا باگێرا", "ticker.txt")
          write_bidi_text("دەنگ و باس", "static.txt")

          class Player:
              def __init__(self):
                  self.process = None
                  self.last_ts = 0
                  self.data = {}
                  self.command = 'play'
                  self.last_ad_time = time.time()
                  self.ad_index = 0
                  
              def poll(self):
                  try:
                      r = requests.get(RTDB_URL, timeout=3)
                      if r.status_code == 200:
                          data = r.json()
                          if data:
                              ts = int(data.get('timestamp', 0))
                              cmd = data.get('command', 'play')
                              payload_str = data.get('payload', '{}')
                              
                              if ts > self.last_ts:
                                  self.last_ts = ts
                                  try:
                                      self.data = json.loads(payload_str)
                                      ticker_text = self.data.get('t', 'بەخێربێن')
                                      write_bidi_text(ticker_text, "ticker.txt")
                                  except:
                                      pass
                                  
                                  if cmd == 'ticker_only':
                                      return False
                                  else:
                                      self.command = cmd
                                      return True
                  except:
                      pass
                  return False

              def kill_ffmpeg(self):
                  if self.process:
                      try:
                          self.process.kill()
                          self.process.wait()
                      except:
                          pass
                      self.process = None

              def play_media_chunk(self, url, itype, duration_sec, start_offset, logo_url):
                  if not logo_url or logo_url.strip() == '':
                      logo_url = 'https://i.postimg.cc/Dwwpt9B0/1000034754-removebg-preview.png'
                      
                  # لێرەدا هاوکێشەی x='-tw+mod(t*150\,W+tw)' بەکارهاتووە کە شریتەکە لە چەپەوە دەهێنێتە ژوورەوە بەرەو ڕاست
                  filter_complex = r"[1:v]scale=220:-1[logo];[0:v][logo]overlay=W-w-35:35[v1];[v1]drawtext=text='Media bagera tv':fontfile=myfont.ttf:fontcolor=white:fontsize=36:x=W-tw-35:y=270:borderw=2:bordercolor=black[v2];[v2]drawbox=y=ih-80:color=black@0.85:width=iw:height=80:t=fill[v3];[v3]drawtext=fontfile=myfont.ttf:textfile=ticker.txt:reload=1:fontcolor=white:fontsize=38:y=H-58:x='-tw+mod(t*150\,W+tw)':shadowcolor=black:shadowx=2:shadowy=2[v4];[v4]drawbox=x=iw-280:y=ih-80:color=#8B5A2B@1.0:width=280:height=80:t=fill[v5];[v5]drawtext=fontfile=myfont.ttf:textfile=static.txt:reload=1:fontcolor=white:fontsize=38:x=W-280+(280-tw)/2:y=H-58:shadowcolor=black:shadowx=2:shadowy=2[v6];[v6]drawbox=x=0:y=ih-80:color=#8B5A2B@1.0:width=160:height=80:t=fill[v7];[v7]drawtext=fontfile=myfont.ttf:text='%{localtime\:%R}':fontcolor=white:fontsize=45:x=(160-tw)/2:y=H-62:shadowcolor=black:shadowx=2:shadowy=2[vout]"
                  
                  cmd = ['ffmpeg']
                  if itype == 'image':
                      cmd.extend(['-loop', '1', '-t', str(int(duration_sec)), '-i', url])
                      cmd.extend(['-i', logo_url, '-f', 'lavfi', '-i', 'anullsrc=r=48000:cl=stereo'])
                      cmd.extend(['-filter_complex', filter_complex, '-map', '[vout]', '-map', '2:a'])
                  else:
                      if start_offset > 0 and '.m3u8' not in url:
                          cmd.extend(['-ss', str(start_offset)])
                      cmd.extend(['-re', '-t', str(int(duration_sec)), '-i', url])
                      cmd.extend(['-i', logo_url])
                      cmd.extend(['-filter_complex', filter_complex, '-map', '[vout]', '-map', '0:a?'])
                  
                  cmd.extend(['-c:v', 'libx264', '-preset', 'veryfast', '-b:v', '2500k', '-maxrate', '2500k', '-bufsize', '5000k', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-f', 'flv', RTMP_URL])
                  
                  self.process = subprocess.Popen(cmd)
                  start_time = time.time()
                  
                  while time.time() - start_time < duration_sec:
                      if self.process.poll() is not None:
                          break 
                      time.sleep(2) 
                      if self.poll():
                          self.kill_ffmpeg()
                          return "interrupted"
                  
                  self.kill_ffmpeg()
                  return "completed"

              def run(self):
                  while not self.poll():
                      time.sleep(2)
                  
                  while True:
                      if self.command == 'stop':
                          offline_img = self.data.get('o', '').strip()
                          if not offline_img: offline_img = self.data.get('l', '').strip()
                          if not offline_img: offline_img = 'https://i.postimg.cc/Dwwpt9B0/1000034754-removebg-preview.png'
                              
                          res = self.play_media_chunk(offline_img, 'image', 3600, 0, self.data.get('l', offline_img))
                          if res == "interrupted": continue
                      else:
                          playlist = self.data.get('play', [])
                          ads = self.data.get('ads', [])
                          try:
                              ad_int_sec = int(float(self.data.get('ai', 10)) * 60)
                          except:
                              ad_int_sec = 600
                          logo = self.data.get('l', '').strip() or 'https://i.postimg.cc/Dwwpt9B0/1000034754-removebg-preview.png'
                          
                          if not playlist:
                              time.sleep(2)
                              self.poll()
                              continue
                          
                          interrupted = False
                          for item in playlist:
                              target_time_str = item.get('time', '').strip()
                              if target_time_str:
                                  try:
                                      now = datetime.datetime.now()
                                      hh, mm = map(int, target_time_str.split(':'))
                                      target_dt = now.replace(hour=hh, minute=mm, second=0, microsecond=0)
                                      if target_dt > now:
                                          wait_seconds = (target_dt - now).total_seconds()
                                          res = self.play_media_chunk(logo, 'image', wait_seconds, 0, logo)
                                          if res == "interrupted":
                                              interrupted = True
                                              break
                                  except:
                                      pass
                                      
                              if interrupted: break

                              url = item.get('url', '').strip()
                              if not url: continue
                              itype = item.get('type', 'video')
                              dur = int(item.get('duration', 60)) * 60
                              remaining_dur = dur
                              current_offset = 0
                              
                              while remaining_dur > 0:
                                  now = time.time()
                                  if ad_int_sec > 0 and len(ads) > 0:
                                      time_since_ad = now - self.last_ad_time
                                      if time_since_ad >= ad_int_sec:
                                          current_ad = ads[self.ad_index % len(ads)]
                                          ad_url = current_ad.get('url', '').strip()
                                          ad_type = current_ad.get('type', 'video')
                                          ad_dur = int(current_ad.get('duration', 30))
                                          if ad_url:
                                              res = self.play_media_chunk(ad_url, ad_type, ad_dur, 0, logo)
                                              if res == "interrupted":
                                                  interrupted = True
                                                  break
                                          self.ad_index += 1
                                          self.last_ad_time = time.time()
                                          continue
                                      
                                      time_until_ad = ad_int_sec - time_since_ad
                                      play_chunk = min(remaining_dur, time_until_ad)
                                  else:
                                      play_chunk = remaining_dur
                                      
                                  play_chunk = int(play_chunk)
                                  if play_chunk <= 0: play_chunk = 1
                                  
                                  res = self.play_media_chunk(url, itype, play_chunk, current_offset, logo)
                                  if res == "interrupted":
                                      interrupted = True
                                      break
                                      
                                  remaining_dur -= play_chunk
                                  current_offset += play_chunk
                                  
                              if interrupted:
                                  break

          if __name__ == '__main__':
              player = Player()
              player.run()
          EOF
          python3 stream_manager.py
