name: LiveZon Cloud Playout

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'دۆخی پەخش'
        required: false
        default: 'play'
      logo_url:
        description: 'لینکی لۆگۆ'
        required: false
        default: 'https://i.postimg.cc/Dwwpt9B0/1000034754-removebg-preview.png'
      ticker_text:
        description: 'شریتی هەواڵ'
        required: false
        default: 'بەخێربێن'
      playlist_data:
        description: 'خشتەی پەخش (JSON)'
        required: false
        default: '[]'
      ad_data:
        description: 'ڕێکلام (JSON)'
        required: false
        default: '{}'
      offline_image:
        description: 'وێنەی کوژانەوە'
        required: false
        default: 'https://i.postimg.cc/Dwwpt9B0/1000034754-removebg-preview.png'

concurrency:
  group: "livezon-playout"
  cancel-in-progress: true

jobs:
  start_stream:
    runs-on: ubuntu-latest
    steps:
      - name: دابەزاندنی پێداویستییەکان
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip3 install Pillow arabic-reshaper python-bidi --break-system-packages
          wget -qO myfont.ttf "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf"

      - name: ئامادەکردنی نووسینەکان
        env:
          TICKER_TEXT: ${{ github.event.inputs.ticker_text }}
        run: |
          cat << 'EOF' > format_text.py
          import os
          from PIL import Image, ImageDraw, ImageFont
          ticker = os.environ.get('TICKER_TEXT', 'بەخێربێن')
          static = "دەنگ و باس"
          def create_img(text, filename, font_size):
              font = ImageFont.truetype("myfont.ttf", font_size)
              try:
                  bbox = font.getbbox(text, direction="rtl", language="ckb")
                  width = bbox[2] - bbox[0]
                  img = Image.new("RGBA", (max(10, width + 50), 80), (0,0,0,0))
                  draw = ImageDraw.Draw(img)
                  draw.text((27, 12), text, font=font, fill=(0,0,0,255), direction="rtl", language="ckb")
                  draw.text((25, 10), text, font=font, fill=(255,255,255,255), direction="rtl", language="ckb")
              except Exception:
                  import arabic_reshaper
                  from bidi.algorithm import get_display
                  reshaper = arabic_reshaper.ArabicReshaper(configuration={'language': 'Kurdish', 'delete_harakat': True})
                  bidi_text = get_display(reshaper.reshape(text))
                  bbox = font.getbbox(bidi_text)
                  width = bbox[2] - bbox[0]
                  img = Image.new("RGBA", (max(10, width + 50), 80), (0,0,0,0))
                  draw = ImageDraw.Draw(img)
                  draw.text((27, 12), bidi_text, font=font, fill=(0,0,0,255))
                  draw.text((25, 10), bidi_text, font=font, fill=(255,255,255,255))
              img.save(filename)
          create_img(ticker, "ticker.png", 42)
          create_img(static, "static.png", 40)
          EOF
          python3 format_text.py

      - name: مەکینەی پەخش (Time-Based Playout)
        env:
          RTMP_URL: ${{ secrets.OKRU_RTMP_URL }}
          TZ: Asia/Baghdad
          MODE: ${{ github.event.inputs.mode }}
          PLAYLIST_DATA: ${{ github.event.inputs.playlist_data }}
          AD_DATA: ${{ github.event.inputs.ad_data }}
          LOGO_URL: ${{ github.event.inputs.logo_url }}
          OFFLINE_IMAGE: ${{ github.event.inputs.offline_image }}
        run: |
          cat << 'EOF' > stream_manager.py
          import os, json, subprocess, time, sys

          mode = os.environ.get('MODE', 'play')
          rtmp_url = os.environ.get('RTMP_URL', '')
          logo_url = os.environ.get('LOGO_URL', '')
          offline_img = os.environ.get('OFFLINE_IMAGE', '')
          if not offline_img: offline_img = logo_url
          
          try: playlist = json.loads(os.environ.get('PLAYLIST_DATA', '[]'))
          except: playlist = []
          
          try: ad = json.loads(os.environ.get('AD_DATA', '{}'))
          except: ad = {}

          filter_complex = r"[1:v]scale=220:-1[logo];[0:v][logo]overlay=W-w-35:35[v1];[v1]drawtext=text='Media bagera tv':fontfile=myfont.ttf:fontcolor=white:fontsize=26:x=W-tw-35:y=270:borderw=2:bordercolor=black[v2];[v2]drawbox=y=ih-80:color=black@0.85:width=iw:height=80:t=fill[v3];[v3][2:v]overlay=x='W-mod(t*150\,W+w)':y=H-80[v4];[v4]drawbox=x=iw-280:y=ih-80:color=#8B5A2B@1.0:width=280:height=80:t=fill[v5];[v5][3:v]overlay=x=W-280+(280-w)/2:y=H-80[v6];[v6]drawbox=x=0:y=ih-80:color=#8B5A2B@1.0:width=160:height=80:t=fill[v7];[v7]drawtext=fontfile=myfont.ttf:text='%{localtime\:%R}':fontcolor=white:fontsize=45:x=(160-tw)/2:y=H-62:shadowcolor=black:shadowx=2:shadowy=2"

          def play_media(url, itype, duration_sec, start_offset=0):
              cmd = ['ffmpeg']
              if itype == 'image':
                  cmd.extend(['-loop', '1', '-t', str(duration_sec), '-i', url])
                  cmd.extend(['-i', logo_url, '-i', 'ticker.png', '-i', 'static.png'])
                  cmd.extend(['-f', 'lavfi', '-i', 'anullsrc=r=48000:cl=stereo'])
                  cmd.extend(['-filter_complex', filter_complex, '-map', '[v7]', '-map', '4:a'])
              else:
                  if start_offset > 0 and '.m3u8' not in url:
                      cmd.extend(['-ss', str(start_offset)])
                  cmd.extend(['-re', '-t', str(duration_sec), '-i', url])
                  cmd.extend(['-i', logo_url, '-i', 'ticker.png', '-i', 'static.png'])
                  cmd.extend(['-filter_complex', filter_complex, '-map', '[v7]', '-map', '0:a?'])
              
              cmd.extend(['-c:v', 'libx264', '-preset', 'veryfast', '-b:v', '2500k', '-maxrate', '2500k', '-bufsize', '5000k', '-pix_fmt', 'yuv420p'])
              cmd.extend(['-c:a', 'aac', '-b:a', '128k', '-f', 'flv', rtmp_url])
              subprocess.run(cmd)

          if mode == 'stop':
              print("--- پەخش وەستێنرا ---")
              while True: play_media(offline_img, 'image', 86400)
          else:
              try: ad_interval_min = float(ad.get('interval') or 0)
              except: ad_interval_min = 0
              ad_interval_sec = int(ad_interval_min * 60)
              
              try: ad_duration = int(ad.get('duration') or 30)
              except: ad_duration = 30
              
              ad_url = ad.get('url', '').strip()
              if not playlist:
                  sys.exit(0)

              last_ad_time = time.time()

              while True:
                  for item in playlist:
                      url = item.get('url', '').strip()
                      if not url: continue
                      try: item_dur = int(float(item.get('duration') or 60) * 60)
                      except: item_dur = 3600
                      
                      remaining_dur = item_dur
                      current_offset = 0
                      
                      while remaining_dur > 0:
                          now = time.time()
                          if ad_interval_sec > 0 and ad_url != '':
                              time_since_ad = now - last_ad_time
                              if time_since_ad >= ad_interval_sec:
                                  play_media(ad_url, ad.get('type', 'video'), ad_duration)
                                  last_ad_time = time.time()
                                  continue 
                              
                              time_until_ad = ad_interval_sec - time_since_ad
                              play_chunk = min(remaining_dur, time_until_ad)
                          else:
                              play_chunk = remaining_dur
                              
                          play_chunk = int(play_chunk)
                          if play_chunk <= 0: play_chunk = 1
                          
                          play_media(url, item.get('type', 'video'), play_chunk, current_offset)
                          
                          remaining_dur -= play_chunk
                          current_offset += play_chunk
                          
                  time.sleep(1)
          EOF
          python3 stream_manager.py
